[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "expertsrs"
version = "0.5.4.dev0"
description = "Traceable research runtime for user-centric remote sensing analysis"
requires-python = ">=3.11"
dependencies = [
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai]==0.7.5",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "rasterio>=1.3,<2",
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
domain = ["shapely==2.1.1", "pyshp==2.3.1"]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["ExpertsRS"]
testpaths = ["ExpertsRS"]

[project.scripts]
expertsrs = "ExpertsRS.__main__:main"

[tool.setuptools]
packages = ["ExpertsRS", "ExpertsRS.tools", "ExpertsRS.workflow", "ExpertsRS.evaluation", "ExpertsRS.evaluation.ch1"]

[tool.setuptools.package-data]
ExpertsRS = ["data/*.tif", "evaluation/ch1/*.json"]
